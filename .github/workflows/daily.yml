name: note daily analytics

on:
  schedule:
    - cron: "37 14 * * *"
  workflow_dispatch:
    inputs:
      force_weekly:
        description: "週次レポートも作成する"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: note-analytics
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: データ取得
        run: python scripts/collect.py
        env:
          NOTE_USER: ${{ vars.NOTE_USER || 'ha_03ru_01' }}

      - name: 分析・週次レポート
        run: python scripts/analyze.py
        env:
          FORCE_WEEKLY: ${{ inputs.force_weekly && '1' || '0' }}

      - name: データをコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

      - name: Discordに通知
        if: success()
        run: python scripts/notify.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
